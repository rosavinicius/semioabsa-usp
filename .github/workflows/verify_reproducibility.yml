name: Reproducibility & Anti-Leakage CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib

      - name: Run automated reproducibility & anti-leakage test suite
        run: python -m unittest discover -s tests -v

      - name: Verify exact statistical tables & bootstrap CIs
        run: python scripts/verify_stats.py
